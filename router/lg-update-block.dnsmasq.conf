# Second layer: sinkhole only LG firmware-update hosts (dnsmasq syntax).
# Pi-hole v6: paste these lines into Settings > All settings > Misc > misc.dnsmasq_lines
# (v6 ignores /etc/dnsmasq.d unless misc.etc_dnsmasq_d is enabled).
# Do NOT block all of lge.com: that breaks the Content Store, LG account login and time sync.
# Each host gets both an IPv4 and an IPv6 null address so AAAA queries are not forwarded upstream.
address=/snu.lge.com/0.0.0.0
address=/snu.lge.com/::
address=/su.lge.com/0.0.0.0
address=/su.lge.com/::
address=/su-dev.lge.com/0.0.0.0
address=/su-dev.lge.com/::
address=/su-ssl.lge.com/0.0.0.0
address=/su-ssl.lge.com/::
